<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="icon" type="image/png" href="https://i.postimg.cc/7fyxChdk/abo-alabed-lwjw.png">
<link rel="apple-touch-icon" href="https://i.postimg.cc/7fyxChdk/abo-alabed-lwjw.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta charset="UTF-8">
    <title>FAROOJ</title>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --text-color: #000000;
            --box-bg: #ffffff;
            --border-color: #ddd;
            --primary-red: #8B0000;
            --primary-red-hover: #A52A2A;
        }
        [data-theme="light"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --box-bg: #1e1e1e;
            --border-color: #333;
        }

          body {
            font-family: sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color); 
            padding: 10px; 
            margin: 0; 
            transition: background 0.3s, color 0.3s; 
        }
        .category-title { 
            background: var(--primary-red); 
            color: white; 
            padding: 18px 22px !important; 
            cursor: pointer; 
            border-radius: 12px !important; 
            font-weight: 800 !important; 
            margin-bottom: 12px !important; 
            text-align: center; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.5px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .category-title:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }
        .cat-content { display: none; margin-bottom: 15px; }
        .item-container { 
            margin: 8px 0; 
            background: var(--box-bg); 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .item-title { 
            padding: 15px 18px !important; 
            cursor: pointer; 
            font-size: 16px !important;
            font-weight: 700 !important; 
            border-bottom: 1px solid var(--border-color); 
            color: var(--text-color);
            border-radius: 10px !important;
            margin-bottom: 8px !important;
        }
        .ingredients-list { 
            padding: 15px; 
            background: var(--box-bg); 
            line-height: 2; 
            font-weight: bold; 
            display: none; 
            color: var(--text-color);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }
        .search-box { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 20px; 
            border: 2px solid rgba(139, 0, 0, 0.2); 
            border-radius: 14px; 
            box-sizing: border-box; 
            background: rgba(255, 255, 255, 0.95); 
            color: var(--text-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        body.light-mode #searchInput, 
        .light #searchInput, 
        [data-theme="light"] #searchInput {
            background-color: #000000 !important; 
            color: #ffffff !important;           
        }
        input.qty { 
            width: 90px !important; 
            padding: 10px 14px !important; 
            border: 1px solid var(--border-color, #444) !important; 
            border-radius: 8px !important; 
            background: var(--bg-color, #121212) !important; 
            color: var(--text-color, #fff) !important;
            font-size: 17px !important;
            text-align: center;
        }
        button { 
            background: var(--primary-red); 
            color: white; 
            border: none; 
            padding: 14px 22px !important; 
            cursor: pointer; 
            border-radius: 12px !important; 
            font-size: 16px !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: all 0.2s ease !important;
        }
        button:active {
            transform: scale(0.97);
        }
        button:hover {
            background-color: var(--primary-red-hover);
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .item-container {
            animation: slideUpFade 0.5s ease forwards;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="mainContent"></div>

    <script>
        // 1. 
        window.addEventListener("DOMContentLoaded", () => {
            let customStyle = document.createElement("style");
            customStyle.innerHTML = `

                }

                    text-align: center;
                    background: var(--bg-color, #121212) !important;

                }

                .category-title {
                    padding: 18px 22px !important;

                    font-weight: 800 !important;
                    border-radius: 12px !important;
                    margin-bottom: 12px !important;

                    cursor: pointer;
                }

                .item-title {
                    padding: 15px 18px !important;

                    font-weight: 700 !important;
                    border-radius: 10px !important;
                    margin-bottom: 8px !important;
                    cursor: pointer;
                }
            `;
            document.head.appendChild(customStyle);
        });

        // 2. 
        window.addEventListener("DOMContentLoaded", () => {
// if (localStorage.getItem("app_logged_in") === "true") {
//     return;
// }
                 let oldScreen = document.getElementById("app-login-screen");
            if (oldScreen) oldScreen.remove();

            let loginScreen = document.createElement("div");
            loginScreen.id = "app-login-screen";
            loginScreen.style.cssText = `
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                background: #ffffff !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: space-around !important;
                z-index: 2147483647 !important;
                padding: 40px 20px !important;
                box-sizing: border-box !important;
                font-family: sans-serif !important;
                transition: opacity 1s ease;
            `;

            loginScreen.innerHTML = `
                <div style="text-align: center; margin-top: 10px;">
                    <h3 style="color: #ff3b3b; font-size: 20px; margin: 0 0 5px 0; font-weight: bold;">تم الإغلاق من قبل الإعداد</h3>
                    <p style="color: #666666; font-size: 14px; margin: 0;">(Salah Housam)</p>
                </div>

                <div style="
                    width: 100%;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                ">
                    <img src="https://i.postimg.cc/gJNqvcVk/abo-alabed-lwjw.png" alt="فروج أبو العبد" style="
                        width: 100%;
                        max-width: 400px;
                        height: auto;
                        object-fit: contain;
                        mix-blend-mode: multiply;
                        filter: contrast(110%) saturate(115%);
                        animation: smoothZoomIn 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
                    ">
                </div>

                <div style="width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
                    <p style="color: #444; font-size: 15px; text-align: center; margin: 0;">يرجى إدخال كلمة المرور</p>
                    <input type="password" id="app-password-input" placeholder="اكتب كلمة المرور..." style="
                        width: 100%;
                        padding: 16px;
                        font-size: 16px;
                        border: 2px solid #ddd;
                        border-radius: 12px;
                        outline: none;
                        text-align: center;
                        background: #f9f9f9;
                        box-sizing: border-box;
                    ">
                    <button id="app-login-btn" style="
                        width: 100%;
                        padding: 16px;
                        font-size: 18px;
                        font-weight: bold;
                        color: #ffffff;
                        background: #b30000;
                        border: none;
                        border-radius: 12px;
                        cursor: pointer;
                        box-shadow: 0 4px 15px rgba(179, 0, 0, 0.3);
                    ">دخول</button>
                </div>
                <style>
                    @keyframes smoothZoomIn {
                        0% { transform: scale(0.1); opacity: 0; }
                        100% { transform: scale(1); opacity: 1; }
                    }
                </style>
            `;
            
            document.body.appendChild(loginScreen);

            document.getElementById("app-login-btn").addEventListener("click", () => {
                let pass = document.getElementById("app-password-input").value;
                if(pass === "9090") { 
                    localStorage.setItem("app_logged_in", "true");
                    let screen = document.getElementById("app-login-screen");
                    screen.style.opacity = "0";
                    setTimeout(() => screen.remove(), 500);
                } else {
                    alert("كلمة المرور غير صحيحة!");
                }
            });
        });

        let currentLang = 'ar';

        // 3. 
        window.addEventListener('DOMContentLoaded', () => {
            if (!document.body.hasAttribute("data-theme")) {
                document.body.setAttribute("data-theme", "dark");
            }

            let toolbar = document.createElement('div');
            toolbar.className = 'master-toolbar';
            toolbar.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: var(--box-bg, #1e1e1e); padding: 12px 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color, #333); box-shadow: 0 2px 8px rgba(0,0,0,0.2);";
            
            let titleSpan = document.createElement('span');
            titleSpan.innerHTML = "<b>Farooj Abu Al-Abd</b>";
            titleSpan.style.cssText = "font-weight: 900; font-size: 18px; color: var(--text-color, #fff); letter-spacing: 0.5px;";

            let btnContainer = document.createElement('div');
            btnContainer.style.cssText = "display: flex; gap: 10px; align-items: center;";

            // 
            let langBtn = document.createElement('button');
            langBtn.className = 'lang-btn-master';
            langBtn.innerHTML = '🌐 English';
            langBtn.onclick = function() {
                currentLang = currentLang === 'ar' ? 'en' : 'ar';
                document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
                document.documentElement.setAttribute('lang', currentLang);
                langBtn.innerHTML = currentLang === 'ar' ? '🌐 English' : '🌐 عربي';
                document.getElementById('searchInput').placeholder = currentLang === 'ar' ? "🔍 ابحث عن صنف..." : "🔍 Search for item...";
                render();
            };

            //
                        
            let themeBtn = document.createElement('button');
            themeBtn.className = 'theme-btn-master';
            themeBtn.innerHTML = document.body.getAttribute("data-theme") === "dark" ? '🌙 Dark Mode' : '☀️ Light Mode';
            
            themeBtn.onclick = function() {
                let body = document.body;
                let currentTheme = body.getAttribute("data-theme");
                if (currentTheme === "dark") {
                    body.setAttribute("data-theme", "light");
                    themeBtn.innerHTML = '☀️ Light Mode';
                } else {
                    body.setAttribute("data-theme", "dark");
                    themeBtn.innerHTML = '🌙 Dark Mode';
                }
            };
             btnContainer.appendChild(langBtn);
            btnContainer.appendChild(themeBtn);

            toolbar.appendChild(titleSpan);
            toolbar.appendChild(btnContainer);
            document.body.insertBefore(toolbar, document.getElementById('searchInput'));
            
            render();
        });

        // 4. 
        function isItemNew(itemDate) {
            if (!itemDate) return false;
            let added = new Date(itemDate);
            let now = new Date("2026-07-25");
            let diffDays = (now - added) / (1000 * 60 * 60 * 24);
            return diffDays >= 0 && diffDays <= 30;
        }

        function categoryHasNew(catItems) {
            if (!catItems) return false;
            return catItems.some(item => isItemNew(item.dateAdded));
        }

      function render(filter = "") {
    let container = document.getElementById('mainContent');
    container.innerHTML = "";

    menu.forEach((cat) => {
        let catName = currentLang === 'ar' ? cat.cat : cat.cat_en;
        let filteredItems = cat.items.item ? cat.items : cat.items.filter(item => {
            let itemName = currentLang === 'ar' ? item.n : item.n_en;
            return itemName.toLowerCase().includes(filter.toLowerCase());
        });

        if (filteredItems.length === 0 && filter !== "") return;

        let catDiv = document.createElement('div');
        
        let titleDiv = document.createElement('div');
        titleDiv.className = "category-title";
        titleDiv.innerHTML = catName;
        titleDiv.onclick = function() {
            let content = this.nextElementSibling;
            content.style.display = content.style.display === "block" ? "none" : "block";
        };

        let contentDiv = document.createElement('div');
        contentDiv.className = "cat-content";
        if (filter !== "") contentDiv.style.display = "block";

        filteredItems.forEach((item) => {
            let itemName = currentLang === 'ar' ? item.n : item.n_en;
            
            let itemBox = document.createElement('div');
            itemBox.className = "item-container";

            let itemHeader = document.createElement('div');
            itemHeader.className = "item-title";
            itemHeader.innerHTML = itemName;
            itemHeader.onclick = function() {
                let ingList = this.nextElementSibling;
                ingList.style.display = ingList.style.display === "block" ? "none" : "block";
            };
            itemBox.appendChild(itemHeader);

            let ingDiv = document.createElement('div');
            ingDiv.className = "ingredients-list";
            
            // تصميم مكان المقادير وحاسبة الكمية ومعها زر الفيديو بجانب زر الحساب
            ingDiv.innerHTML = `
                <div style="margin-bottom: 10px; white-space: pre-line;">${currentLang === 'ar' ? item.d : item.d_en}</div>
                <div style="display: flex; gap: 10px; align-items: center; margin-top: 15px;">
                    <input type="number" class="qty" value="${item.b}" min="0.1" step="any">
                    <button onclick="calculateRecipe(this)">حساب</button>
                    <button class="video-btn" onclick="openVideo('${item.video || ""}')" style="background: #333; color: #fff;">🎥 فيديو</button>
                </div>
            `;

            itemBox.appendChild(ingDiv);
            contentDiv.appendChild(itemBox);
        });

        catDiv.appendChild(titleDiv);
        catDiv.appendChild(contentDiv);
        container.appendChild(catDiv);
    });
}

// دالة التعامل مع ضغط زر الفيديو (لو موجود يفتح، لو مش موجود ينبه الموظف)
function openVideo(videoUrl) {
    if (videoUrl && videoUrl.trim() !== "") {
        window.open(videoUrl, "_blank");
    } else {
        alert("عفواً، فيديو التحضير غير متوفر لهذا الصنف حالياً.");
    }
}
                html += `<div class="category-title" onclick="toggleCat(this)">${catName} ${catBadge}</div>
                         <div class="cat-content">`;
                
                cat.items.forEach(item => {
                    let itemName = currentLang === 'ar' ? item.n : (item.n_en || item.n);
                    let itemDesc = currentLang === 'ar' ? item.d : (item.d_en || item.d);
                    
                    let itemBadge = isItemNew(item.dateAdded) 
                        ? ' <span style="background: #ff4757; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-right: 6px;">NEW</span>' 
                        : '';

                    html += `<div class="item-container">
                                <div class="item-title" onclick="toggleItem(this)">${itemName} ${itemBadge}</div>
                                <div class="ingredients-list">
                                    ${itemDesc.replace(/\n/g, '<br>')}
                                    <div style="margin-top:15px; display: flex; align-items: center; gap: 10px;">
                                        ${currentLang === 'ar' ? 'الكمية:' : 'Quantity:'} 
                                        <input type="number" class="qty" value="${item.b}"> 
                                        <button onclick="calc(this, ${item.b}, \`${itemDesc}\`, \`${itemName}\`)">${currentLang === 'ar' ? 'حساب' : 'Calculate'}</button>
                                    </div>
                                </div>
                             </div>`;
                });
                html += `</div>`;
            });
            document.getElementById('mainContent').innerHTML = html;
        }

        function toggleCat(el) { el.nextElementSibling.style.display = (el.nextElementSibling.style.display === "block") ? "none" : "block"; }
        function toggleItem(el) { el.nextElementSibling.style.display = (el.nextElementSibling.style.display === "block") ? "none" : "block"; }

       function searchItems() {
    let input = document.getElementById('searchInput').value.toLowerCase();
    let categories = document.querySelectorAll('.cat-content');
    let items = document.querySelectorAll('.item-container');

    if (input === "") {
        items.forEach(item => item.style.display = "block");
        categories.forEach(cat => cat.style.display = "none");
        return;
    }

    items.forEach(item => {
        let text = item.textContent.toLowerCase();
        if (text.includes(input)) {
            item.style.display = "block";
            let parentCat = item.closest('.cat-content');
            if (parentCat) {
                parentCat.style.display = "block";
            }
        } else {
            item.style.display = "none";
        }
    });
}

        // 6. 
        function calc(btn, baseWeight, d, customItemName) {
            let parent = btn.parentElement.parentElement;
            let itemName = customItemName || (currentLang === 'ar' ? "الوصفة" : "Recipe");
            
            let qtyInput = parent.querySelector('.qty');
            let current = qtyInput ? parseFloat(qtyInput.value) : baseWeight;
            let mult = current / baseWeight;
            let lines = d.split('\n');
            
            let resText = currentLang === 'ar' 
                ? `مقادير (${itemName}) لكمية ${current}:\n` 
                : `Ingredients for (${itemName}) qty ${current}:\n`;
            
            lines.forEach(item => {
        let m = item.match(/(.+?):(\d+\.?\d*)(.*)/);
        if (m) {
            let name = m[1].trim();
            let originalVal = parseFloat(m[2]);
            let unit = m[3].trim();
            
            let calculatedVal = originalVal * mult;
            
            if (unit === 'k' && calculatedVal < 1) {
                calculatedVal = Math.round(calculatedVal * 1000);
                unit = 'g';
            } else if (unit === 'k') {
                calculatedVal = parseFloat(calculatedVal.toFixed(2));
            } else {
                let decimals = calculatedVal < 1 ? 2 : 1;
                calculatedVal = parseFloat(calculatedVal.toFixed(decimals));
            }
            
            resText += "\n" + name + ": " + calculatedVal + unit;
        } else {
            resText += "\n" + item;
        }
    });

           let existingModal = document.getElementById('custom-modal');
            if (existingModal) existingModal.remove();

            let modal = document.createElement('div');
            modal.id = 'custom-modal';
            modal.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; z-index:99999;";
            
            modal.innerHTML = `
                <div style="background: var(--box-bg, #1e1e1e); color: var(--text-color, #fff); padding: 20px; border-radius: 12px; width: 90%; max-width: 320px; text-align: center; border: 1px solid var(--border-color, #333); box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
                    <h3 style="margin-top:0; color: #d32f2f; font-size: 18px; border-bottom: 2px solid var(--border-color, #333); padding-bottom: 8px;">${itemName}</h3>
                    <p style="margin: 5px 0 10px 0; font-size: 13px; opacity: 0.8;">${currentLang === 'ar' ? 'الكمية لـ:' : 'Qty for:'} ${current}</p>
                    <textarea id="copy-text" style="width:100%; height:250px; font-size:22px; font-weight:bold; background:var(--bg-color, #121212); color:var(--text-color, #fff); border:1px solid var(--border-color, #333); border-radius:6px; padding:10px; resize:none; font-family:sans-serif; box-sizing:border-box;" readonly>${resText}</textarea>
                    <div style="margin-top: 15px; display: flex; gap: 8px;">
                        <button onclick="copyRecipeText()" style="flex:1; background:#4CAF50;">📋 ${currentLang === 'ar' ? 'نسخ' : 'Copy'}</button>
                        <button onclick="sendToWhatsApp()" style="flex:1; background:#25D366;">💬 WhatsApp</button>
                    </div>

                    
                    <button onclick="document.getElementById('custom-modal').remove()" style="width:100%; margin-top: 8px; background:#d32f2f;">${currentLang === 'ar' ? 'إغلاق' : 'Close'}</button>
                    <p id="copy-status" style="color:#4CAF50; font-size:12px; margin-top:8px; display:none;">${currentLang === 'ar' ? 'تم النسخ بنجاح! 🚀' : 'Copied successfully! 🚀'}</p>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function copyRecipeText() {
            let textarea = document.getElementById('copy-text');
            textarea.select();
            navigator.clipboard.writeText(textarea.value).then(() => {
                let status = document.getElementById('copy-status');
                status.style.display = "block";
                setTimeout(() => { 
                    status.style.display = "none"; 
                    document.getElementById('custom-modal').remove(); 
                }, 1500);
            });
        }
 function sendToWhatsApp() {
    let text = document.getElementById('copy-text').value;
    let boldText = text.split('\n').map(line => line.trim() ? `*${line}*` : line).join('\n');
    let url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(boldText);
    window.open(url, '_blank');
}
      
    </script>
